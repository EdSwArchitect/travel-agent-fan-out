[project]
name = "travel-agents"
version = "0.1.0"
description = "Parallel multi-agent travel examples using the OpenAI Agents SDK"
requires-python = ">=3.11"
dependencies = [
  "openai-agents",
  "pydantic>=2",
  "python-dotenv>=1",
]

[dependency-groups]
dev = [
  "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
