[project]
name = "travel-agents"
version = "0.1.0"
description = "OpenAI Agents SDK travel examples with routing, stays, and flight enrichment"
requires-python = ">=3.11"
dependencies = [
  "openai-agents",
  "pydantic>=2",
  "python-dotenv>=1",
]

[dependency-groups]
dev = [
  "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
